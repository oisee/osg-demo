name: book

# Builds the book in English and Russian, attaches EPUB and PDF to the
# release, and mails the EPUBs to a Kindle through Gmail when the repository
# has the secrets GMAIL_ADDRESS, GMAIL_APP_PASSWORD and KINDLE_EMAIL.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build and attach to (empty: build only, no upload)"
        required: false
      kindle:
        description: "Mail the EPUBs to the Kindle"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: book-${{ github.event.release.tag_name || inputs.tag || github.ref }}

jobs:
  book:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag || github.ref }}
          persist-credentials: false
      - name: Install pandoc and weasyprint (both from the runner's apt)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q pandoc weasyprint fonts-dejavu
      - name: Build the book
        run: book/build.sh all "$RUNNER_TEMP/book"
      - name: Keep the books as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: osg-demo-book
          path: |
            ${{ runner.temp }}/book/*.epub
            ${{ runner.temp }}/book/*.pdf
      - name: Attach to the release
        if: env.TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" "$RUNNER_TEMP"/book/*.epub "$RUNNER_TEMP"/book/*.pdf --clobber
      # a re-run after a partial failure mails every EPUB again
      - name: Send to Kindle
        if: github.event_name == 'release' || inputs.kindle
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          KINDLE_EMAIL: ${{ secrets.KINDLE_EMAIL }}
          RELEASE_TAG: ${{ env.TAG }}
        run: python3 .github/scripts/send-to-kindle.py "$RUNNER_TEMP"/book/*.epub
