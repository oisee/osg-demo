name: book

# Builds the book in English and Russian, attaches EPUB and PDF to the
# release, and mails the EPUBs to a Kindle through Gmail when the repository
# has the secrets GMAIL_ADDRESS, GMAIL_APP_PASSWORD and KINDLE_EMAIL.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build and attach to (empty: build only, no upload)"
        required: false
      kindle:
        description: "Mail the EPUBs to the Kindle"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: book-${{ github.event.release.tag_name || inputs.tag || github.ref }}

jobs:
  book:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag || github.ref }}
          persist-credentials: false
      # no apt: its mirror stalled two releases for 10+ minutes. pandoc is
      # the official .deb (checked by hash), weasyprint comes from PyPI with
      # a pip cache; both at the versions the runner's apt gave before, so
      # the book comes out the same
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/book-requirements.txt
      - name: Install pandoc and weasyprint (pinned)
        env:
          PANDOC_VERSION: "3.1.3"
          PANDOC_SHA256: caa7e0410f9e2cb1da2eb8db13cc97b5548fe455985e2c944e3929d22f99bcdc
        run: |
          curl -fsSL -o "$RUNNER_TEMP/pandoc.deb" \
            "https://github.com/jgm/pandoc/releases/download/$PANDOC_VERSION/pandoc-$PANDOC_VERSION-1-amd64.deb"
          echo "$PANDOC_SHA256  $RUNNER_TEMP/pandoc.deb" | sha256sum -c -
          sudo dpkg -i "$RUNNER_TEMP/pandoc.deb"
          pip install -r .github/book-requirements.txt
          pandoc --version | head -1
          weasyprint --version
          fc-list | grep -ci dejavu
      - name: Build the book
        env:
          # the release tag names the files and goes on the title page; a
          # build without a tag falls back to git describe
          BOOK_VERSION: ${{ env.TAG }}
        run: book/build.sh all "$RUNNER_TEMP/book"
      - name: Keep the books as a workflow artifact
        uses: actions/upload-artifact@v6
        with:
          name: osg-demo-book
          path: |
            ${{ runner.temp }}/book/*.epub
            ${{ runner.temp }}/book/*.pdf
      - name: Attach to the release
        if: env.TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" "$RUNNER_TEMP"/book/*.epub "$RUNNER_TEMP"/book/*.pdf --clobber
      # a re-run after a partial failure mails every EPUB again
      - name: Send to Kindle
        if: github.event_name == 'release' || inputs.kindle
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          KINDLE_EMAIL: ${{ secrets.KINDLE_EMAIL }}
          RELEASE_TAG: ${{ env.TAG }}
        run: python3 .github/scripts/send-to-kindle.py "$RUNNER_TEMP"/book/*.epub
