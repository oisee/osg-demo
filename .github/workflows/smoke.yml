name: demo smoke

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: demo-smoke-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  fleet:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out the demo
        uses: actions/checkout@v5
        with:
          path: demo
      - name: Book excerpts in step with src
        working-directory: demo
        run: node test/book-snippets.mjs
      - name: Check out current OSD main
        uses: actions/checkout@v5
        with:
          repository: oisee/open-steamgate
          ref: main
          path: osd
      - name: Record the runtime under test
        run: git -C osd rev-parse HEAD
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: osd/package-lock.json
      - name: Install and bootstrap OSD
        working-directory: osd
        run: |
          npm ci
          npm run bootstrap
      - name: Fleet smoke on SQLite
        working-directory: demo
        env:
          OSD_HOME: ${{ github.workspace }}/osd
          SLICE_SKIP_UI: "1"
        run: node test/slice.mjs
      - name: Fleet smoke on DuckDB
        working-directory: demo
        env:
          OSD_HOME: ${{ github.workspace }}/osd
          SLICE_SKIP_UI: "1"
          STG_DB: duckdb
        run: node test/slice.mjs
      - uses: actions/setup-go@v6
        if: success() || failure()
        with:
          go-version: "1.26"
          cache: false
      - name: Fleet command line program (osabap, chapter 14)
        if: success() || failure()
        working-directory: demo
        env:
          OSD_HOME: ${{ github.workspace }}/osd
        run: node test/cli.mjs
      - name: Fleet jobs on SQLite file
        if: success() || failure()
        working-directory: demo
        env:
          OSD_HOME: ${{ github.workspace }}/osd
        run: node test/jobs.mjs
      # DSL L3 (chapter 16) reads a pile's keys with I BT ranges, which
      # @abaplint/runtime expands in SQL from 2.13.96 (OSD's lockfile pinned
      # 2.13.89 at the time of writing); after every step above, on OSD's own
      # runtime, and never a downgrade
      - name: Runtime with I BT in SQL
        if: success() || failure()
        working-directory: osd
        run: |
          node -e 'const [a,b,c]=require("@abaplint/runtime/package.json").version.split(".").map(Number);process.exit(a*1e6+b*1e3+c>=2013096?0:1)' \
            || npm install --no-save --no-audit --no-fund @abaplint/runtime@2.13.96
          node -p 'require("@abaplint/runtime/package.json").version'
      - name: Fleet night set in DSL L3 (chapter 16)
        if: success() || failure()
        working-directory: demo
        env:
          OSD_HOME: ${{ github.workspace }}/osd
        run: node test/l3.mjs
