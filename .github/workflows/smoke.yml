name: demo smoke

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: demo-smoke-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

# Two targets. "tag" checks the demo against the open-steamgate tag the book
# is written for (book/baseline.yaml): the book's contract, and the result a
# pull request is judged by. "main" checks it against open-steamgate main as
# a canary: it shows early what main is about to break for this repository,
# and does not fail the run (continue-on-error).
jobs:
  fleet:
    name: fleet (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    continue-on-error: ${{ matrix.target == 'main' }}
    strategy:
      fail-fast: false
      matrix:
        target: [tag, main]
    steps:
      - name: Check out the demo
        uses: actions/checkout@v5
        with:
          path: demo
      - name: Book excerpts in step with src
        working-directory: demo
        run: node test/book-snippets.mjs
      - name: Which open-steamgate to check against
        id: osd
        working-directory: demo
        run: |
          if [ "${{ matrix.target }}" = tag ]; then
            ref=$(sed -n 's/^tag: *"\{0,1\}\([^"]*\)"\{0,1\} *$/\1/p' book/baseline.yaml)
            test -n "$ref" || { echo "::error::no tag in book/baseline.yaml"; exit 1; }
          else
            ref=main
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "open-steamgate ref: $ref"
      - name: Check out open-steamgate
        uses: actions/checkout@v5
        with:
          repository: oisee/open-steamgate
          ref: ${{ steps.osd.outputs.ref }}
          path: osd
      - name: Record the runtime under test
        run: git -C osd rev-parse HEAD
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: osd/package-lock.json
      - name: Install and bootstrap OSD
        working-directory: osd
        run: |
          npm ci
          npm run bootstrap
      - name: Fleet smoke on SQLite
        working-directory: demo
        env:
          OSD_HOME: ${{ github.workspace }}/osd
          SLICE_SKIP_UI: "1"
          SLICE_L2_DRIFT: ${{ matrix.target == 'main' && 'warn' || '' }}
        run: node test/slice.mjs
      - name: Fleet smoke on DuckDB
        working-directory: demo
        env:
          OSD_HOME: ${{ github.workspace }}/osd
          SLICE_SKIP_UI: "1"
          SLICE_L2_DRIFT: ${{ matrix.target == 'main' && 'warn' || '' }}
          STG_DB: duckdb
        run: node test/slice.mjs
      - uses: actions/setup-go@v6
        if: success() || failure()
        with:
          go-version: "1.26"
          cache: false
      - name: Fleet command line program (osabap, chapter 14)
        if: success() || failure()
        working-directory: demo
        env:
          OSD_HOME: ${{ github.workspace }}/osd
        run: node test/cli.mjs
      - name: Fleet jobs on SQLite file
        if: success() || failure()
        working-directory: demo
        env:
          OSD_HOME: ${{ github.workspace }}/osd
        run: node test/jobs.mjs
      - name: Fleet night set in DSL L3 (chapter 16)
        if: success() || failure()
        working-directory: demo
        env:
          OSD_HOME: ${{ github.workspace }}/osd
        run: node test/l3.mjs
      - name: C in ABAP (chapter 18)
        if: success() || failure()
        working-directory: demo
        env:
          OSD_HOME: ${{ github.workspace }}/osd
        run: node test/iti.mjs
