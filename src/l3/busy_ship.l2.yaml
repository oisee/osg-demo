# Chapter 16, stage 1 of the night set: a filter. A ship with a voyage
# departing after the check date is busy; keys( ) hands back each such ship
# once, and the set keeps them in its worklist `busy`. The examples use ships
# X001-X004 and 2027 dates, so the seed rows never meet them.
rule: busy-ship
class: zcl_osd_fleet_l3_busy
title: A ship has a voyage departing after the check date
for: ZOSD_FLEET_SHIP as ship
range: ship.ship_id
keys: true
forbid:
  exists: ZOSD_FLEET_VOY as voy
  where: voy.ship_id = ship.ship_id and voy.dep_date > $date
alert: "{ship.ship_id} {ship.name}: voyage {voy.voyage_id} departs {voy.dep_date}"
boundaries: auto
examples:
  - name: a voyage ahead
    date: 20270301
    rows:
      ZOSD_FLEET_SHIP: [{ship_id: X001, name: Zephyr, status: A}]
      ZOSD_FLEET_VOY: [{voyage_id: X00001, ship_id: X001, dep_date: 20270305}]
    expect:
      - "X001 Zephyr: voyage X00001 departs 20270305"
    expect_keys: [X001]
  - name: only past voyages
    date: 20270301
    rows:
      ZOSD_FLEET_SHIP: [{ship_id: X002, name: Halcyon, status: D}]
      ZOSD_FLEET_VOY: [{voyage_id: X00002, ship_id: X002, dep_date: 20270301}]
    expect: []
    expect_keys: []
  - name: one key for several voyages
    date: 20270301
    rows:
      ZOSD_FLEET_SHIP:
        - {ship_id: X001, name: Zephyr, status: A}
        - {ship_id: X003, name: Skylark, status: M}
      ZOSD_FLEET_VOY:
        - {voyage_id: X00003, ship_id: X003, dep_date: 20270310}
        - {voyage_id: X00004, ship_id: X003, dep_date: 20270302}
        - {voyage_id: X00005, ship_id: X001, dep_date: 20270303}
    expect:
      - "X001 Zephyr: voyage X00005 departs 20270303"
      - "X003 Skylark: voyage X00003 departs 20270310"
      - "X003 Skylark: voyage X00004 departs 20270302"
    expect_keys: [X001, X003]
  - name: the range keeps the inner ship
    date: 20270301
    range: [{sign: I, option: BT, low: X002, high: X003}]
    rows:
      ZOSD_FLEET_SHIP:
        - {ship_id: X001, name: Zephyr, status: A}
        - {ship_id: X003, name: Skylark, status: A}
        - {ship_id: X004, name: Kestrel, status: A}
      ZOSD_FLEET_VOY:
        - {voyage_id: X00006, ship_id: X001, dep_date: 20270305}
        - {voyage_id: X00007, ship_id: X003, dep_date: 20270305}
        - {voyage_id: X00008, ship_id: X004, dep_date: 20270305}
    expect:
      - "X003 Skylark: voyage X00007 departs 20270305"
    expect_keys: [X003]
