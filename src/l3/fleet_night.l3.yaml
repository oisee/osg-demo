# Chapter 16: the fleet's night run as a DSL L3 set (open-steamgate
# docs/dsl-l3.md, "Stages, filters and a schedule"). Stage 1, a filter,
# puts every ship with a voyage ahead into the worklist `busy`; stage 2 runs
# the deep rules over those ships only, two ships per job; a periodic job
# starts the set every day at 02:00 system time.
#   node tools/dsl-l3.mjs build <osg-demo>/src/l3/fleet_night.l3.yaml --out <osg-demo>/src/l3
set: night
title: The fleet at night, busy ships first, then the deep checks
date: $date
class: zcl_osd_fleet_night
report: zosd_fleet_night
stages:
  - stage: candidates
    filter: true
    worklist: busy
    piles: {source: ships, size: 2}
    rules:
      - rule: busy_ship.l2.yaml
  - stage: checks
    piles: {source: "worklist:busy", size: 2}
    rules:
      - rule: low_steam_voyage.l2.yaml
      - rule: maintenance_voyage.l2.yaml
schedule: {every: 1d, at: "020000"}
ports:
  ships:
    kind: source
    table: ZOSD_FLEET_SHIP
    key: ship_id
    variants:
      table: generated
  alerts:
    kind: sink
    table: ZOSD_L3_ALERT
    group: [set_name, rule_name, model_hash, check_date]
    seq: alert_seq
    variants:
      log: generated
bindings:
  ships: table
  alerts: log
