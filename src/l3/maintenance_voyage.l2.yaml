# Chapter 16, stage 2 of the night set: chapter 12's rule with a driving-key
# range, so the set can pile it over the worklist `busy`.
rule: maintenance-voyage
class: zcl_osd_fleet_l3_maint
title: A ship in maintenance has no voyage departing after the check date
for: ZOSD_FLEET_SHIP as ship
range: ship.ship_id
when: ship.status = 'M'
forbid:
  exists: ZOSD_FLEET_VOY as voy
  where: voy.ship_id = ship.ship_id and voy.dep_date > $date
alert: "{ship.ship_id} {ship.name}: in maintenance, voyage {voy.voyage_id} departs {voy.dep_date}"
boundaries: auto
examples:
  - name: flagged
    date: 20270301
    rows:
      ZOSD_FLEET_SHIP: [{ship_id: X001, name: Zephyr, status: M}]
      ZOSD_FLEET_VOY: [{voyage_id: X00001, ship_id: X001, dep_date: 20270305}]
    expect:
      - "X001 Zephyr: in maintenance, voyage X00001 departs 20270305"
  - name: a ship aloft is fine
    date: 20270301
    rows:
      ZOSD_FLEET_SHIP: [{ship_id: X002, name: Halcyon, status: A}]
      ZOSD_FLEET_VOY: [{voyage_id: X00002, ship_id: X002, dep_date: 20270310}]
    expect: []
