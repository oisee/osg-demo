# Chapter 17: the night set of chapter 16 under a governor (open-steamgate
# docs/dsl-l3.md, "Governor: the manual-handling budget"). The same stages
# and rules; resilience: (which a governor needs) and a budget of one open
# alert per run, so the second of S004's two alerts stops the run at its
# glass until a person continues it with a reason.
#   node tools/dsl-l3.mjs build <osg-demo>/src/l3/fleet_watch.l3.yaml --out <osg-demo>/src/l3
set: watch
title: The night set under a governor, with a budget for the people who answer
date: $date
class: zcl_osd_fleet_watch
report: zosd_fleet_watch
stages:
  - stage: candidates
    filter: true
    worklist: busy
    piles: {source: ships, size: 2}
    rules:
      - rule: busy_ship.l2.yaml
  - stage: checks
    piles: {source: "worklist:busy", size: 2}
    rules:
      - rule: low_steam_voyage.l2.yaml
      - rule: maintenance_voyage.l2.yaml
ports:
  ships:
    kind: source
    table: ZOSD_FLEET_SHIP
    key: ship_id
    variants:
      table: generated
  alerts:
    kind: sink
    table: ZOSD_L3_ALERT
    group: [set_name, rule_name, model_hash, check_date]
    seq: alert_seq
    variants:
      log: generated
      capture: generated
  close:
    kind: autoclose
    variants:
      none: generated
bindings:
  ships: table
  alerts: log
  close: none
resilience:
  retry: {max: 2, backoff: 60}
  stale: 900
  keep: {days: 30}
governor:
  budget: {glass: 1, counts: open, warn: 0.7, narrow_at: 0.8, per_pile: 0}
  funnel: {group_by: object, autoclose: port:close}
settings:
  tunable: [budget.glass]
